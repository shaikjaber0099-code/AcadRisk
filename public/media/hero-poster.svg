<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>
  <circle cx="960" cy="380" r="380" fill="#6366f1" opacity="0.18" filter="url(#blurFilter)"/>
  <circle cx="1300" cy="500" r="300" fill="#a855f7" opacity="0.15" filter="url(#blurFilter)"/>
  <circle cx="600" cy="600" r="280" fill="#3b82f6" opacity="0.12" filter="url(#blurFilter)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#312e81" stroke-width="1" opacity="0.25">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>
  
  <!-- Floating Hologram Wave -->
  <path d="M 0,650 Q 480,480 960,620 T 1920,540 L 1920,1080 L 0,1080 Z" fill="url(#streamGrad)"/>
</svg>
